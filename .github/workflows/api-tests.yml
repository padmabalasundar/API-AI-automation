name: API Automation Test Suite

# Trigger workflow on every push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai python-dotenv pytest pytest-html pydantic

    # 4. Run Pytest Suite using secret API key stored in GitHub Secrets
    - name: Run API Tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest api-ai-automation.py --html=report.html --self-contained-html

    # 5. Upload HTML Report as an artifact
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-html-report
        path: report.html